# SearXNG — JSON habilitado para Apsara Vimana
# En Render puedes poner SEARXNG_SECRET; esta clave evita fallo si no hay env.
use_default_settings: true

general:
  instance_name: "Apsara Vimana SearXNG 2"
  debug: false

server:
  secret_key: "cambia-esta-clave-en-render-SEARXNG-SECRET-2026-apsara-vimana-b"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "es-ES"
  formats:
    - html
    - json

ui:
  static_use_hash: true

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: false
