<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B0B8BF" />
  <title>Apsara Vimana — asistente</title>
  <meta name="description" content="Conversa con Apsara sobre música, arte y sabiduría." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gray: #B0B8BF;
      --text: #24313a;
      --user: #e5edf3;
      --bot: #f6f8f9;
      --green: #16a34a;
      --ink: #f8f6f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: Lora, Georgia, serif;
      overflow: hidden;
      background: #0d1520;
      color: var(--text);
    }
    #hero {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    #hero .blur {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.12); filter: blur(36px); opacity: 0.7;
    }
    #hero .main {
      position: relative; width: 100%; height: 100%;
      object-fit: contain; object-position: center top;
    }
    #hero .veil {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,14,24,0.75) 0%, rgba(10,14,24,0.2) 50%, rgba(10,14,24,0.1) 100%);
    }
    #gray-screen {
      position: fixed; inset: 0; z-index: 1;
      background: var(--gray);
      opacity: 0; visibility: hidden;
      transition: opacity 0.55s ease, visibility 0.55s ease;
      pointer-events: none;
    }
    body.writing #gray-screen { opacity: 1; visibility: visible; }
    .logo {
      position: fixed; left: 1.1rem; top: 0.7rem; z-index: 30;
      width: 2.1rem; height: 2.1rem; border-radius: 50%; object-fit: cover;
      box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    }
    .app {
      position: relative; z-index: 10; height: 100%; max-width: 42rem;
      margin: 0 auto; display: flex; flex-direction: column; padding: 3.2rem 1rem 0;
    }
    #conversation {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 0.25rem 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .welcome {
      /* Pegado a la zona de la barra: no tapa la cara */
      margin-top: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 0 0.5rem 0.85rem;
      transition: opacity 0.4s ease;
    }
    body.writing .welcome {
      opacity: 0; pointer-events: none; height: 0; min-height: 0;
      overflow: hidden; padding: 0; margin: 0;
    }
    .welcome h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.25rem; font-weight: 600; color: var(--ink);
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
      letter-spacing: 0.02em;
    }
    .welcome p {
      margin-top: 0.25rem; font-size: 0.82rem;
      color: rgba(248,246,240,0.92); text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .msg { display: flex; margin-bottom: 0.75rem; }
    .msg.user { justify-content: flex-end; }
    .msg.bot { justify-content: flex-start; gap: 0.45rem; align-items: flex-start; }
    .msg .avatar {
      width: 2rem; height: 2rem; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; background: #c5ccd1; box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .bubble {
      max-width: 88%; padding: 0.65rem 0.9rem; border-radius: 1rem;
      font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; color: var(--text);
      box-shadow: 0 2px 10px rgba(35,50,60,0.1);
    }
    .msg.user .bubble { background: var(--user); border-bottom-right-radius: 0.25rem; }
    .msg.bot .bubble { background: var(--bot); border-bottom-left-radius: 0.25rem; }
    .links { margin-top: 0.4rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .link-card {
      display: block; text-decoration: none; color: #1a3a5c;
      background: #fff; border-radius: 0.65rem; padding: 0.45rem 0.65rem;
      border: 1px solid rgba(0,0,0,0.07);
    }
    .link-title { font-weight: 600; font-size: 0.8rem; display: block; }
    .link-url { font-size: 0.68rem; color: #666; display: block; }
    .options { margin-top: 0.45rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .opt-chip {
      border: 1px solid #9cc8e6; background: #fff; color: #1a3a5c;
      border-radius: 999px; padding: 0.35rem 0.7rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit;
    }
    .opt-chip:hover { background: #e8f4fc; }
    .composer-wrap {
      flex-shrink: 0; z-index: 20;
      padding: 0.35rem 0 calc(0.85rem + env(safe-area-inset-bottom));
    }
    #typing {
      height: 1.1rem; max-width: 40rem; margin: 0 auto 0.2rem; text-align: right;
      font-family: "Cormorant Garamond", serif; font-size: 0.72rem; font-style: italic;
      color: rgba(248,246,240,0.75); transition: color 0.4s ease;
    }
    body.writing #typing { color: #6b5a1e; }
    #composer {
      max-width: 40rem; margin: 0 auto; display: flex; align-items: flex-end; gap: 0.45rem;
      background: #fff; border: 1.5px solid #9cc8e6; border-radius: 1.4rem;
      padding: 0.35rem 0.35rem 0.35rem 1rem;
      box-shadow: 0 5px 18px rgba(45,61,72,0.14);
    }
    #message {
      flex: 1; border: 0; outline: 0; resize: none; background: transparent;
      color: var(--text); font-size: 0.95rem; line-height: 1.4;
      max-height: 8rem; padding: 0.5rem 0; font-family: inherit;
    }
    #message::placeholder { color: #7a8690; }
    #send {
      width: 2.5rem; height: 2.5rem; border: 0; border-radius: 50%;
      background: var(--green); color: #fff; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0;
    }
    #send:disabled { opacity: 0.4; cursor: default; }
    #send svg { width: 1.15rem; height: 1.15rem; stroke: #fff; }

    .char-ghost {
      position: absolute;
      left: 1.05rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 0.78rem;
      color: rgba(122, 134, 144, 0.55);
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: opacity 0.25s ease;
    }
    .char-ghost.hidden { opacity: 0; }
    #composer { position: relative; }
  </style>
</head>
<body>
  <div id="hero" aria-hidden="true">
    <img class="blur" src="index_files/2_fBUK.jpg" alt="" />
    <img class="main" src="index_files/2_fBUK.jpg" alt="" />
    <div class="veil"></div>
  </div>
  <div id="gray-screen" aria-hidden="true"></div>
  <img class="logo" src="index_files/logo_fBUK.png" alt="Vimana" onerror="this.style.display='none'" />

  <div class="app">
    <div id="conversation">
      <div class="welcome" id="welcome">
        <h1>Namaste 🌺</h1>
        <p>Estoy aquí para ayudar</p>
      </div>
    </div>
    <div class="composer-wrap">
      <p id="typing"></p>
      <form id="composer" autocomplete="off">
        <span class="char-ghost" id="charGhost" aria-hidden="true"></span>
        <textarea id="message" rows="1" maxlength="600" placeholder="Escribe tu mensaje..." enterkeyhint="send"></textarea>
        <button type="submit" id="send" aria-label="Enviar" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    var API = '/api/chat';
    var conversation = document.getElementById('conversation');
    var form = document.getElementById('composer');
    var message = document.getElementById('message');
    var sendBtn = document.getElementById('send');
    var typing = document.getElementById('typing');
    var busy = false;

    var MAX_CHARS = 600;
    var charGhost = document.getElementById('charGhost');
    function updateCharGhost() {
      if (!charGhost) return;
      var len = message.value.length;
      if (len > 0) {
        charGhost.classList.add('hidden');
        charGhost.textContent = '';
      } else {
        charGhost.classList.remove('hidden');
        charGhost.textContent = MAX_CHARS + ' caracteres';
      }
    }
    updateCharGhost();


    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function scrollBottom() {
      conversation.scrollTop = conversation.scrollHeight;
    }
    /** Deja el inicio de la respuesta a la vista (mitad superior del área de chat) */
    function scrollToMsgStart(el) {
      if (!el) { scrollBottom(); return; }
      try {
        var cRect = conversation.getBoundingClientRect();
        var eRect = el.getBoundingClientRect();
        var delta = eRect.top - cRect.top - cRect.height * 0.18;
        conversation.scrollTop = conversation.scrollTop + delta;
      } catch (err) {
        scrollBottom();
      }
    }
    function activarPantallaGris() {
      document.body.classList.add('writing');
    }
    function limpiarChat() {
      var nodes = conversation.querySelectorAll('.msg');
      for (var i = 0; i < nodes.length; i++) nodes[i].remove();
      document.body.classList.remove('writing');
      var w = document.getElementById('welcome');
      if (w) {
        w.style.opacity = '';
        w.style.height = '';
        w.style.minHeight = '';
        w.classList.remove('hidden');
      }
    }

    function userBubble(text) {
      activarPantallaGris();
      var row = el('div', 'msg user');
      row.appendChild(el('div', 'bubble', text));
      conversation.appendChild(row);
      scrollBottom();
    }

    function botBubble(data) {
      activarPantallaGris();
      if (data && data.action === 'LIMPIAR') {
        limpiarChat();
        return;
      }
      var row = el('div', 'msg bot');
      var av = el('img', 'avatar');
      av.src = (data && data.image) || 'index_files/2_fBUK.jpg';
      av.alt = 'Apsara';
      row.appendChild(av);
      var col = document.createElement('div');
      col.style.maxWidth = '88%';
      col.appendChild(el('div', 'bubble', (data && data.reply) || '…'));
      if (data && data.links && data.links.length) {
        var list = el('div', 'links');
        data.links.forEach(function (L) {
          var a = el('a', 'link-card');
          a.href = L.u; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.appendChild(el('span', 'link-title', L.t || L.u));
          a.appendChild(el('span', 'link-url', String(L.u || '').replace(/^https?:\/\//, '')));
          list.appendChild(a);
        });
        col.appendChild(list);
      }
      if (data && data.options && data.options.length) {
        var opts = el('div', 'options');
        data.options.forEach(function (lab) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'opt-chip';
          b.textContent = lab;
          b.addEventListener('click', function () {
            message.value = lab;
            enviar();
          });
          opts.appendChild(b);
        });
        col.appendChild(opts);
      }
      row.appendChild(col);
      conversation.appendChild(row);
      scrollToMsgStart(row);
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on || !message.value.trim();
      message.disabled = on;
      typing.textContent = on ? 'Apsara está pensando…' : '';
    }

    async function enviar() {
      var q = message.value.trim();
      if (!q || busy) return;
      userBubble(q);
      message.value = '';
      message.style.height = 'auto';
      setBusy(true);
      try {
        var r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: q })
        });
        var data = await r.json();
        botBubble(data);
      } catch (e) {
        botBubble({ reply: 'No pude completar la respuesta. Inténtalo de nuevo.', links: [] });
      } finally {
        setBusy(false);
        message.focus();
      }
    }

    message.addEventListener('input', function () {
      updateCharGhost();
      if (message.value.length > 0) activarPantallaGris();
      message.style.height = 'auto';
      message.style.height = Math.min(message.scrollHeight, 128) + 'px';
      sendBtn.disabled = busy || !message.value.trim();
    });
    message.addEventListener('keydown', function (e) {
      if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') {
        if (message.value.length > 0 || e.key.length === 1) activarPantallaGris();
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviar();
      }
    });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      enviar();
    });
    
    /* Despertar SearXNG al abrir el chat (Render free) — el usuario no nota nada */
    function despertarSearx() {
      try {
        fetch('/api/wake-searx', { method: 'GET', cache: 'no-store' }).catch(function () {});
      } catch (e) {}
    }
    despertarSearx();
    /* Repetir cada 12 min si la pestaña sigue abierta */
    setInterval(despertarSearx, 12 * 60 * 1000);

    setInterval(function () {
      if (document.visibilityState === 'visible') {
        fetch('/api/ping').catch(function () {});
        despertarSearx();
      }
    }, 600000);
  })();
  </script>
</body>
</html>
