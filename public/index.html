<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Apsara Vimana — asistente de conversación</title>
  <meta name="description" content="Conversa sobre música, arte, sabiduría y cultura védica con Apsara." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: oklch(98.5% 0.012 85);
      --foreground: oklch(25% 0.04 265);
      --card: #ffffff;
      --border: oklch(90% 0.02 85);
      --muted-foreground: oklch(52% 0.03 265);
      --primary: oklch(32% 0.11 265);
      --gold: oklch(68% 0.14 80);
      --hero-ink: #f8f6f0;
      --radius: 0.75rem;
      --green: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: Lora, Georgia, serif;
      background: #0f1220;
      color: var(--foreground);
      overflow: hidden;
    }

    /* Fondo hero (foto Apsara) */
    .hero-layer {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .hero-layer .blur {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.1); filter: blur(40px); opacity: 0.7;
    }
    .hero-layer .main {
      position: relative; width: 100%; height: 100%;
      object-fit: contain; object-position: center top;
    }
    .hero-veil {
      position: absolute; inset: 0;
      background: linear-gradient(
        to top,
        rgba(15, 18, 32, 0.95) 0%,
        rgba(15, 18, 32, 0.4) 40%,
        rgba(15, 18, 32, 0.15) 100%
      );
    }

    .logo {
      position: fixed; left: 1.25rem; top: 0.75rem; z-index: 50;
      height: 2.25rem; width: 2.25rem; border-radius: 9999px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      background: #111;
    }

    .shell {
      position: relative; z-index: 10;
      height: 100%; max-width: 48rem; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: 3.5rem 1.25rem 0;
    }

    #conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.5rem;
    }

    .welcome {
      min-height: 55vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      text-align: center; padding-bottom: 1.5rem;
    }
    .welcome.hidden { display: none; }
    .welcome h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.75rem, 9vw, 3.75rem);
      font-weight: 600;
      color: var(--hero-ink);
      text-shadow: 0 4px 18px rgba(0,0,0,0.45);
    }
    .welcome p {
      margin-top: 1rem; max-width: 36rem;
      color: rgba(248, 246, 240, 0.9);
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      font-size: 1.05rem; line-height: 1.55;
    }

    .msg { display: flex; margin: 0 0 0.85rem; }
    .msg.user { justify-content: flex-end; }
    .msg.bot { justify-content: flex-start; gap: 0.55rem; align-items: flex-start; }
    .msg .avatar {
      width: 2.25rem; height: 2.25rem; border-radius: 9999px;
      object-fit: cover; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .bubble {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1.1rem;
      font-size: 0.98rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }
    .msg.user .bubble {
      background: rgba(255, 248, 230, 0.96);
      color: #1a1a22;
      border-bottom-right-radius: 0.3rem;
    }
    .msg.bot .bubble {
      background: var(--card);
      color: #1a1a22;
      border-bottom-left-radius: 0.3rem;
    }
    .links { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .link-card {
      display: block; text-decoration: none; color: #1a3a5c;
      background: #fff; border-radius: 0.75rem;
      padding: 0.55rem 0.75rem; border: 1px solid rgba(0,0,0,0.08);
    }
    .link-title { font-weight: 600; font-size: 0.85rem; display: block; }
    .link-url { font-size: 0.72rem; color: #666; display: block; }

    .composer-area {
      flex-shrink: 0;
      padding: 0.35rem 0 calc(1rem + env(safe-area-inset-bottom));
    }
    #typing {
      height: 1.25rem;
      margin: 0 auto 0.25rem;
      max-width: 42rem;
      text-align: right;
      font-family: "Cormorant Garamond", serif;
      font-size: 0.75rem;
      font-style: italic;
      color: var(--gold);
    }
    #composer {
      margin: 0 auto;
      max-width: 42rem;
      display: flex; align-items: flex-end; gap: 0.5rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.95);
      padding: 0.4rem 0.4rem 0.4rem 1.15rem;
      box-shadow: 0 10px 36px rgba(0,0,0,0.28);
    }
    #message {
      flex: 1; border: 0; outline: 0; resize: none;
      background: transparent; color: #1a1a22;
      font-size: 1rem; line-height: 1.45;
      max-height: 10rem; padding: 0.55rem 0;
      font-family: inherit;
    }
    #message::placeholder { color: #7a7a88; }
    #send {
      width: 2.75rem; height: 2.75rem;
      border: 0; border-radius: 9999px;
      background: var(--green); color: #fff;
      cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0; transition: transform 0.15s, opacity 0.15s;
    }
    #send:hover:not(:disabled) { transform: scale(1.05); }
    #send:disabled { opacity: 0.4; cursor: default; }
    #send svg { width: 1.25rem; height: 1.25rem; stroke: #fff; }
    .hint {
      margin: 0.5rem auto 0;
      max-width: 42rem;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(248,246,240,0.55);
    }
  </style>
</head>
<body>
  <!-- Fondo: foto local (sin Lovable) -->
  <div class="hero-layer" aria-hidden="true">
    <img class="blur" src="imagenes/estados/apsara_hero.jpg" alt="" />
    <img class="main" src="imagenes/estados/apsara_hero.jpg" alt="" />
    <div class="hero-veil"></div>
  </div>

  <img class="logo" src="imagenes/estados/logo_vimana.png" alt="Vimana"
       onerror="this.style.display='none'" />

  <div class="shell">
    <div id="conversation">
      <section class="welcome" id="welcome">
        <h1>Namaste 🌺</h1>
        <p>Estoy aquí para conversar contigo sobre música, arte, sabiduría y contenidos de la cultura védica.</p>
      </section>
    </div>

    <div class="composer-area">
      <p id="typing"></p>
      <form id="composer" autocomplete="off">
        <textarea id="message" rows="1" maxlength="600" placeholder="Escribe tu mensaje..." enterkeyhint="send"></textarea>
        <button type="submit" id="send" aria-label="Enviar" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>
      <p class="hint">Apsara Vimana · local + búsqueda gratuita</p>
    </div>
  </div>

  <script>
  (function () {
    /* API del super-agente en el mismo dominio (Render Node) */
    var API = '/api/chat';
    var conversation = document.getElementById('conversation');
    var welcome = document.getElementById('welcome');
    var form = document.getElementById('composer');
    var message = document.getElementById('message');
    var sendBtn = document.getElementById('send');
    var typing = document.getElementById('typing');
    var busy = false;

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function scrollBottom() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function hideWelcome() {
      if (welcome) welcome.classList.add('hidden');
    }

    function userBubble(text) {
      hideWelcome();
      var row = el('div', 'msg user');
      row.appendChild(el('div', 'bubble', text));
      conversation.appendChild(row);
      scrollBottom();
    }

    function botBubble(data) {
      hideWelcome();
      var row = el('div', 'msg bot');
      var av = el('img', 'avatar');
      av.src = (data && data.image) || 'imagenes/estados/apsara_hero.jpg';
      av.alt = 'Apsara';
      row.appendChild(av);
      var col = document.createElement('div');
      col.style.maxWidth = '85%';
      col.appendChild(el('div', 'bubble', (data && data.reply) || '…'));
      if (data && Array.isArray(data.links) && data.links.length) {
        var list = el('div', 'links');
        data.links.forEach(function (L) {
          var a = el('a', 'link-card');
          a.href = L.u;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.appendChild(el('span', 'link-title', L.t || L.u));
          a.appendChild(el('span', 'link-url', String(L.u || '').replace(/^https?:\/\//, '')));
          list.appendChild(a);
        });
        col.appendChild(list);
      }
      row.appendChild(col);
      conversation.appendChild(row);
      scrollBottom();
    }

    function setBusy(on) {
      busy = on;
      sendBtn.disabled = on || !message.value.trim();
      message.disabled = on;
      typing.textContent = on ? 'Apsara está pensando…' : '';
    }

    async function enviar() {
      var q = message.value.trim();
      if (!q || busy) return;
      userBubble(q);
      message.value = '';
      message.style.height = 'auto';
      setBusy(true);
      try {
        var r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: q })
        });
        var data = await r.json();
        botBubble(data);
      } catch (e) {
        botBubble({
          reply: 'No pude completar la respuesta. Inténtalo de nuevo en unos segundos.',
          image: 'imagenes/estados/apsara_hero.jpg',
          links: []
        });
      } finally {
        setBusy(false);
        message.focus();
      }
    }

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      enviar();
    });

    message.addEventListener('input', function () {
      message.style.height = 'auto';
      message.style.height = Math.min(message.scrollHeight, 160) + 'px';
      sendBtn.disabled = busy || !message.value.trim();
    });

    message.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        enviar();
      }
    });

    /* Keep-awake suave en plan free de Render */
    setInterval(function () {
      if (document.visibilityState === 'visible') {
        fetch('/api/ping').catch(function () {});
      }
    }, 10 * 60 * 1000);
  })();
  </script>
</body>
</html>
